name: Build ScreenAlarm Executable

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # 支持在 GitHub 页面手动触发构建

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: 检出源码
      uses: actions/checkout@v4

    - name: 配置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安装依赖 (方案2: 独立安装 CPU 版 PyTorch)
      shell: cmd
      run: |
        python -m pip install --upgrade pip

        :: 1. 优先单独安装 CPU 版 Torch & Torchvision (避免拉取数 GB 的 CUDA 包)
        pip install --default-timeout=300 --retries 10 ^
          torch torchvision ^
          --index-url https://download.pytorch.org/whl/cpu

        :: 2. 安装 requirements.txt 中的其余依赖
        pip install --default-timeout=300 --retries 10 ^
          -r requirements.txt

    - name: 使用 PyInstaller 执行打包
      shell: cmd
      run: |
        :: 打包为单文件 (.exe) 且隐藏命令行终端窗口
        pyinstaller --noconfirm --onefile --windowed --name "ScreenAlarm" ScreenAlarm.py

    - name: 上传构建产物 (Artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: ScreenAlarm-Windows-EXE
        path: dist/ScreenAlarm.exe
