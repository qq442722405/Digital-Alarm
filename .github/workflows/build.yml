name: Build 数字报警 EXE


on:

  workflow_dispatch:



jobs:


  build-windows:


    runs-on: windows-latest


    steps:


    - name: 检出源码
      uses: actions/checkout@v4



    - name: 设置 Python

      uses: actions/setup-python@v5

      with:

        python-version: "3.11"



    - name: 升级pip

      shell: cmd

      run: |

        python -m pip install --upgrade pip setuptools wheel



    - name: 安装CPU Torch

      shell: cmd

      run: |

        pip install ^
        --default-timeout=300 ^
        --retries=10 ^
        torch torchvision ^
        --index-url https://download.pytorch.org/whl/cpu



    - name: 安装依赖

      shell: cmd

      run: |

        pip install ^
        --default-timeout=300 ^
        --retries=10 ^
        -r requirements.txt



    # 强制安装jaraco

    - name: 安装PyInstaller运行依赖

      shell: cmd

      run: |

        pip install ^
        jaraco.text ^
        jaraco.functools ^
        jaraco.context



    - name: 检查文件

      shell: cmd

      run: |

        dir

        dir *.py

        dir *.spec

        dir *.ico



    - name: PyInstaller打包

      shell: cmd

      run: |

        pyinstaller ^
        --clean ^
        --noconfirm ^
        ScreenAlarm.spec



    - name: 查看输出

      shell: cmd

      run: |

        dir dist



    - name: 上传数字报警

      uses: actions/upload-artifact@v4

      with:

        name: 数字报警-Windows

        path: dist/数字报警
