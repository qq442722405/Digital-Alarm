name: Build 数字报警 EXE


on:

  workflow_dispatch:


jobs:

  build-windows:


    runs-on: windows-latest


    steps:


    - name: 下载源码
      uses: actions/checkout@v4



    - name: Python环境
      uses: actions/setup-python@v5

      with:

        python-version: "3.11"



    - name: 更新pip

      shell: cmd

      run: |

        python -m pip install --upgrade pip setuptools wheel



    # 安装CPU torch固定版本

    - name: 安装Torch CPU

      shell: cmd

      run: |

        pip install ^
        torch==2.5.1+cpu ^
        torchvision==0.20.1+cpu ^
        --index-url https://download.pytorch.org/whl/cpu





    - name: 安装依赖

      shell: cmd

      run: |

        pip install ^
        -r requirements.txt





    - name: 安装额外DLL支持

      shell: cmd

      run: |

        pip install ^
        pyinstaller==6.5.0





    - name: 检查文件

      shell: cmd

      run: |

        dir

        dir *.py

        dir *.spec

        dir *.ico





    - name: 打包

      shell: cmd

      run: |

        pyinstaller ^
        --clean ^
        --noconfirm ^
        ScreenAlarm.spec





    - name: 查看结果

      shell: cmd

      run: |

        dir dist





    - name: 上传

      uses: actions/upload-artifact@v4

      with:

        name: 数字报警-Windows

        path: dist/数字报警
