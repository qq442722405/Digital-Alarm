name: Build 数字报警 EXE


# =========================
# 仅手动触发
# =========================
on:

  workflow_dispatch:



jobs:


  build-windows:


    runs-on: windows-latest



    steps:



    # =========================
    # 拉取代码
    # =========================

    - name: 检出源码

      uses: actions/checkout@v4




    # =========================
    # Python环境
    # =========================

    - name: 设置 Python

      uses: actions/setup-python@v5

      with:

        python-version: "3.11"




    # =========================
    # 更新pip
    # =========================

    - name: 升级 pip

      shell: cmd

      run: |

        python -m pip install --upgrade pip setuptools wheel




    # =========================
    # 安装CPU版 PyTorch
    # =========================

    - name: 安装 CPU Torch

      shell: cmd

      run: |

        pip install ^
        --default-timeout=300 ^
        --retries=10 ^
        torch torchvision ^
        --index-url https://download.pytorch.org/whl/cpu





    # =========================
    # 安装项目依赖
    # =========================

    - name: 安装 requirements

      shell: cmd

      run: |

        pip install ^
        --default-timeout=300 ^
        --retries=10 ^
        -r requirements.txt





    # =========================
    # 检查文件
    # =========================

    - name: 检查工程文件

      shell: cmd

      run: |

        echo ===== 当前目录 =====

        dir


        echo ===== Python文件 =====

        dir *.py


        echo ===== Spec文件 =====

        dir *.spec


        echo ===== 图标文件 =====

        dir *.ico





    # =========================
    # PyInstaller打包
    # =========================

    - name: 打包数字报警

      shell: cmd

      run: |

        pyinstaller ^
        --clean ^
        --noconfirm ^
        ScreenAlarm.spec





    # =========================
    # 查看结果
    # =========================

    - name: 查看生成文件

      shell: cmd

      run: |

        echo ===== dist目录 =====

        dir dist





    # =========================
    # 上传EXE
    # =========================

    - name: 上传数字报警

      uses: actions/upload-artifact@v4

      with:


        name: 数字报警-Windows


        path: dist/数字报警.exe
