name: Build Single Executable

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:  # 支持手动在网页点击运行构建

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 1. 拉取代码
      uses: actions/checkout@v4

    - name: 2. 配置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. 安装 Windows Tesseract OCR 引擎
      run: |
        choco install tesseract --no-progress
        # 将 Tesseract OCR 复制到工程根目录以便打包打包进单文件 EXE
        xcopy "C:\Program Files\Tesseract-OCR" "Tesseract-OCR\" /E /I /H /Y

    - name: 4. 安装 Python 依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 5. 使用 PyInstaller 打包单文件 EXE
      run: |
        pyinstaller --noconfirm --onefile --windowed --icon="1.ico" --name="数字报警" --add-data "1.ico;." --add-data "Tesseract-OCR;Tesseract-OCR" main.py

    - name: 6. 上传生成的 EXE 到 GitHub Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: 数字报警-Windows单文件版
        path: dist/数字报警.exe
