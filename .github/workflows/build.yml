name: Build Single Executable

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 1. 拉取代码
      uses: actions/checkout@v4

    - name: 2. 配置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. 安装 Python 依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 4. 打包单文件 EXE
      run: |
        pyinstaller --noconfirm --onefile --windowed --collect-all ddddocr --icon="1.ico" --name="数字报警" --add-data "1.ico;." main.py

    - name: 5. 上传 EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: 数字报警-Windows单文件版
        path: dist/数字报警.exe
