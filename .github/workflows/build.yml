name: Build PaddleOCR 数字识别测试


on:

  workflow_dispatch:


jobs:

  build-windows:


    runs-on: windows-latest


    steps:


    - name: 检出源码
      uses: actions/checkout@v4



    - name: 设置Python

      uses: actions/setup-python@v5

      with:

        python-version: "3.11"



    - name: 更新pip

      shell: cmd

      run: |

        python -m pip install --upgrade pip setuptools wheel



    # 先安装numpy固定版本

    - name: 安装基础依赖

      shell: cmd

      run: |

        pip install ^
        numpy==1.24.4




    # 安装Paddle

    - name: 安装PaddleOCR

      shell: cmd

      run: |

        pip install ^
        paddlepaddle==2.6.2


        pip install ^
        paddleocr==2.7.3




    # 其它依赖

    - name: 安装项目依赖

      shell: cmd

      run: |

        pip install ^
        PyQt5==5.15.10 ^
        opencv-python==4.8.1.78 ^
        pillow==10.3.0 ^
        pyautogui ^
        pyinstaller==6.5.0





    - name: 检查文件

      shell: cmd

      run: |

        dir

        dir *.py




    - name: 打包

      shell: cmd

      run: |

        pyinstaller ^
        --clean ^
        --noconfirm ^
        --onedir ^
        --windowed ^
        --name "数字识别测试" ^
        main.py




    - name: 上传程序

      uses: actions/upload-artifact@v4

      with:

        name: 数字识别测试-Windows

        path: dist/数字识别测试
