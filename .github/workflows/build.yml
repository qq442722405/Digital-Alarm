name: 数字报警

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 配置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: 安装基础编译工具与依赖
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt
        # 强制显式预装 PaddleOCR 所需的 C 扩展核心库
        pip install pyclipper shapely imgaug lmdb pyinstaller

    - name: 使用 PyInstaller 根据 spec 打包
      run: |
        pyinstaller --clean ScreenAlarm.spec

    - name: 上传生成的 EXE 成果物
      uses: actions/upload-artifact@v4
      with:
        name: ScreenMonitorAlarm-Windows
        path: dist/ScreenMonitorAlarm.exe
