name: Build ScreenAlarm EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 升级 pip
        run: |
          python -m pip install --upgrade pip

      - name: 安装依赖
        run: |
          pip install -r requirements.txt

      - name: 使用 Spec 打包 EXE
        shell: cmd
        run: |
          pyinstaller --clean --noconfirm ScreenAlarm.spec

      - name: 上传 EXE
        uses: actions/upload-artifact@v4
        with:
          name: ScreenAlarm_EXE
          path: dist/ScreenAlarm.exe
