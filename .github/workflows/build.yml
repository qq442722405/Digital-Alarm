name: build screen number exe


on:

  workflow_dispatch:


jobs:

  build:

    runs-on: windows-latest


    steps:


    - name: 下载代码
      uses: actions/checkout@v4



    - name: 安装Python
      uses: actions/setup-python@v5

      with:

        python-version: "3.11"



    - name: 更新pip

      run:

        python -m pip install --upgrade pip



    - name: 安装依赖

      run:

        pip install -r requirements.txt



    - name: PyInstaller打包

      run: |


        pyinstaller ^
          --onefile ^
          --windowed ^
          --name "屏幕数字识别V1" ^
          --collect-all easyocr ^
          --collect-all torch ^
          --collect-all torchvision ^
          --hidden-import=cv2 ^
          screen_number_v1.py



    - name: 上传EXE

      uses: actions/upload-artifact@v4

      with:

        name: screen_number_v1

        path: dist/*.exe
