name: Build 数字报警 EXE


on:

  workflow_dispatch:



jobs:


  build-windows:


    runs-on: windows-latest


    steps:


    - name: 检出源码

      uses: actions/checkout@v4



    - name: 设置 Python

      uses: actions/setup-python@v5

      with:

        python-version: "3.11"



    - name: 升级 pip

      shell: cmd

      run: |

        python -m pip install --upgrade pip



    # =========================
    # CPU版 Torch
    # =========================

    - name: 安装 CPU PyTorch

      shell: cmd

      run: |

        pip install ^
        --default-timeout=300 ^
        --retries=10 ^
        torch torchvision ^
        --index-url https://download.pytorch.org/whl/cpu




    # =========================
    # 项目依赖
    # =========================

    - name: 安装 requirements

      shell: cmd

      run: |

        pip install ^
        --default-timeout=300 ^
        --retries=10 ^
        -r requirements.txt




    # =========================
    # PyInstaller依赖补充
    # =========================

    - name: 安装运行依赖

      shell: cmd

      run: |

        pip install ^
        setuptools==69.5.1 ^
        jaraco.text ^
        jaraco.functools ^
        jaraco.context ^
        platformdirs





    # =========================
    # 检查文件
    # =========================

    - name: 检查工程

      shell: cmd

      run: |

        dir

        echo =================

        dir *.py

        echo =================

        dir *.spec

        echo =================

        dir *.ico





    # =========================
    # 打包
    # =========================

    - name: PyInstaller打包

      shell: cmd

      run: |

        pyinstaller ^
        --clean ^
        --noconfirm ^
        ScreenAlarm.spec





    # =========================
    # 查看输出
    # =========================

    - name: 查看生成文件

      shell: cmd

      run: |

        dir dist





    # =========================
    # 上传
    # =========================

    - name: 上传数字报警

      uses: actions/upload-artifact@v4

      with:

        name: 数字报警-Windows

        path: dist/数字报警
