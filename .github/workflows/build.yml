name: Build OCR Tool

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller
      run: |
        # 使用 -i 参数指定图标文件 1.ico
        pyinstaller -w -F --icon=1.ico --name NumberOCR main.py

    - name: Rename Executable
      # 打包完成后，将英文名重命名为中文名，避免 PyInstaller 处理中文名称时可能出现的编码问题
      run: |
        Rename-Item -Path dist\NumberOCR.exe -NewName 数字报警.exe
      shell: powershell

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: 数字报警_Windows
        path: dist\数字报警.exe
