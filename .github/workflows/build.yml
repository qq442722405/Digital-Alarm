name: Build PaddleOCR 数字识别测试


# 仅手动触发
on:

  workflow_dispatch:



jobs:


  build-windows:


    runs-on: windows-latest


    steps:


    # =====================
    # 获取代码
    # =====================

    - name: 检出源码

      uses: actions/checkout@v4




    # =====================
    # Python环境
    # =====================

    - name: 设置 Python

      uses: actions/setup-python@v5

      with:

        python-version: "3.11"




    # =====================
    # 更新pip
    # =====================

    - name: 更新pip

      shell: cmd

      run: |

        python -m pip install --upgrade pip setuptools wheel





    # =====================
    # 安装依赖
    # =====================

    - name: 安装项目依赖

      shell: cmd

      run: |

        pip install ^
        --default-timeout=300 ^
        --retries=10 ^
        -r requirements.txt





    # =====================
    # 安装PyInstaller
    # =====================

    - name: 安装打包工具

      shell: cmd

      run: |

        pip install ^
        pyinstaller==6.5.0





    # =====================
    # 检查文件
    # =====================

    - name: 检查工程

      shell: cmd

      run: |

        echo =====目录=====

        dir


        echo =====Python=====

        dir *.py


        echo =====ICO=====

        dir *.ico






    # =====================
    # 打包
    # =====================

    - name: PyInstaller打包

      shell: cmd

      run: |


        pyinstaller ^
        --clean ^
        --noconfirm ^
        --onedir ^
        --windowed ^
        --name "数字识别测试" ^
        main.py





    # =====================
    # 查看结果
    # =====================

    - name: 查看生成文件

      shell: cmd

      run: |

        dir dist





    # =====================
    # 上传
    # =====================

    - name: 上传EXE

      uses: actions/upload-artifact@v4

      with:


        name: 数字识别测试-Windows


        path: dist/数字识别测试
