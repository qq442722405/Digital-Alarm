name: Build ScreenAlarm EXE

on:

  workflow_dispatch:

  push:
    branches:
      - main
      - master


jobs:

  build:

    runs-on: windows-latest


    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"


    - name: Upgrade pip
      shell: cmd
      run: |
        python -m pip install --upgrade pip


    - name: Install CPU Torch
      shell: cmd
      run: |

        pip install ^
        --default-timeout=300 ^
        --retries 10 ^
        torch torchvision ^
        --index-url https://download.pytorch.org/whl/cpu


    - name: Install requirements
      shell: cmd
      run: |

        pip install ^
        --default-timeout=300 ^
        --retries 10 ^
        -r requirements.txt


    - name: Check files
      shell: cmd
      run: |

        dir


    - name: Build EXE
      shell: cmd
      run: |

        pyinstaller ^
        --clean ^
        --noconfirm ^
        --onefile ^
        --windowed ^
        --name ScreenAlarm ^
        ScreenAlarm.py


    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:

        name: ScreenAlarm-Windows

        path: dist/ScreenAlarm.exe
