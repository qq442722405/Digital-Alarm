name: Build OCR Tool

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # 允许在 GitHub 网页上手动触发

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller
      run: |
        # 使用 -D(文件夹模式) 替代 -F(单文件模式)，因为 PaddleOCR 库很大，单文件解压极慢且易报错
        # 使用 -w 隐藏命令行黑框
        pyinstaller -w -D --name NumberOCR main.py

    - name: Zip the build
      run: |
        Compress-Archive -Path dist\NumberOCR\* -DestinationPath NumberOCR_Windows.zip

    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: NumberOCR_Windows
        path: NumberOCR_Windows.zip
