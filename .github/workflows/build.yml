name: Build Executable

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        # 强制安装 PyMuPDF 的 预编译二进制包（解决 devenv.com 报错）
        pip install "PyMuPDF>=1.23.0" --only-binary PyMuPDF
        # 安装项目主依赖
        pip install "numpy<2" paddlepaddle==2.6.2 paddleocr==2.7.0.0 PyQt5 Pillow imgaug pyclipper shapely lmdb pyinstaller

    - name: Build EXE with PyInstaller
      run: |
        # 获取 paddleocr 安装路径并定位 ppocr 文件夹，将其打包进 EXE
        $PADDLE_DIR = python -c "import paddleocr, os; print(os.path.dirname(paddleocr.__file__))"
        $PPOCR_DIR = Join-Path $PADDLE_DIR "ppocr"
        
        pyinstaller --noconfirm --onedir --windowed `
          --add-data "$PPOCR_DIR;ppocr" `
          --hidden-import "paddleocr" `
          --hidden-import "pyclipper" `
          --hidden-import "shapely" `
          --hidden-import "imgaug" `
          --hidden-import "lmdb" `
          ScreenAlarm.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ScreenAlarm-Windows
        path: dist/ScreenAlarm/
