name: build 数字报警 exe


on:
  workflow_dispatch:


jobs:

  build:

    runs-on: windows-latest


    steps:

    - name: 检出代码
      uses: actions/checkout@v4


    - name: 安装Python

      uses: actions/setup-python@v5

      with:

        python-version: "3.11"



    - name: 升级pip

      run: |

        python -m pip install --upgrade pip



    - name: 安装依赖

      run: |

        pip install -r requirements.txt



    - name: 安装PyInstaller

      run: |

        pip install pyinstaller



    - name: 打包

      shell: pwsh

      run: |


        pyinstaller `
          --onefile `
          --windowed `
          --clean `
          --name "数字报警" `
          --icon "1.ico" `
          --collect-all easyocr `
          --collect-all torch `
          --collect-all torchvision `
          --collect-all cv2 `
          --hidden-import=torch `
          --hidden-import=torchvision `
          --hidden-import=easyocr `
          screen_number_v1.py



    - name: 上传

      uses: actions/upload-artifact@v4

      with:

        name: 数字报警

        path: dist/数字报警.exe
